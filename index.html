<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E8D8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Un regalito para Mile.">
  <meta property="og:title" content="Para Mile ♥">
  <title>Para Mile</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'%3E%3Cpath fill='%23B85323' d='M50 86C20 64 2 46 2 27 2 12 14 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c14 0 26 10 26 25 0 19-18 37-48 59Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
/* =========================================================
   Cumple Mile · estilos
   ========================================================= */

:root {
  --cream: #F3E8D8;
  --terracota: #B85323;
  --terracota-soft: #C27450;
  --grad-a: #C6541D;
  --grad-b: #EB8B1C;
  --ink: #4A3728;
  --ink-soft: #7C6452;
  --track: #E2CCA8;
  --paper: #FAF6F0;
  --kraft: #E5CFA0;
  --wax: #8B1E1E;
  --warm-gray: #CDBDAA;

  --serif: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "Jost", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-io: cubic-bezier(.45, 0, .25, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  touch-action: manipulation;          /* sin zoom por doble toque */
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--serif);
  color: var(--ink);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, .45), transparent 60%),
    radial-gradient(110% 60% at 50% 100%, rgba(229, 207, 160, .38), transparent 70%),
    var(--cream);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body.modal-open { overflow: hidden; }

.app { overflow-x: clip; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible,
.carousel:focus-visible {
  outline: 2px solid var(--terracota);
  outline-offset: 4px;
  border-radius: 6px;
}

.screen {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding:
    max(24px, env(safe-area-inset-top))
    20px
    max(24px, env(safe-area-inset-bottom));
}

/* =========================================================
   PANTALLA 1 · DESBLOQUEO
   ========================================================= */

.screen--unlock {
  transition: opacity .7s var(--ease-out), transform .7s var(--ease-out), filter .7s ease;
}
.screen--unlock.is-leaving {
  opacity: 0;
  transform: scale(.97);
  filter: blur(3px);
  pointer-events: none;
}

.name {
  margin: 0;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(3.2rem, 15vw, 4.6rem);
  line-height: 1;
  color: var(--terracota);
  letter-spacing: .01em;
}

.hint {
  margin: .7rem 0 0;
  min-height: 1.4em;
  font-style: italic;
  font-size: clamp(1.25rem, 5.6vw, 1.6rem);
  color: var(--ink);
  opacity: .85;
}
.hint.is-changing { animation: hint-in .45s var(--ease-out); }
@keyframes hint-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: .85; transform: none; }
}

/* Corazón: 3 capas para no pisar transformaciones
   .heart-btn  -> crece con el progreso
   .heart-beat -> latido en reposo
   .heart-svg  -> "pop" en cada toque */
.heart-btn {
  --level: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: min(54vw, 230px, 34vh);
  width: min(54vw, 230px, 34dvh);
  aspect-ratio: 1;
  margin: clamp(1.4rem, 6vh, 3rem) 0 clamp(1.2rem, 5vh, 2.4rem);
  margin: clamp(1.4rem, 6dvh, 3rem) 0 clamp(1.2rem, 5dvh, 2.4rem);
  transform: scale(calc(1 + var(--level) * .1));
  transition: transform .5s var(--ease-spring);
}
.heart-btn::before {
  content: "";
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(235, 139, 28, .30), rgba(184, 83, 35, 0) 64%);
  opacity: calc(.2 + var(--level) * .8);
  transition: opacity .6s ease;
  pointer-events: none;
}
.heart-beat {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  animation: heartbeat 1.6s ease-in-out infinite;
}
.heart-svg {
  width: 88%;
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 12px 18px rgba(184, 83, 35, .28));
}
.heart-svg.is-pop { animation: pop .42s var(--ease-out); }

@keyframes heartbeat {
  0%, 52%, 100% { transform: scale(1); }
  12% { transform: scale(1.06); }
  24% { transform: scale(1); }
  36% { transform: scale(1.04); }
}
@keyframes pop {
  0%   { transform: scale(1); }
  25%  { transform: scale(.86); }
  60%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}

.ring {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 72%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1.5px solid rgba(184, 83, 35, .45);
  translate: -50% -50%;
  pointer-events: none;
  animation: ring .8s var(--ease-out) forwards;
}
@keyframes ring {
  from { scale: .6; opacity: .9; }
  to   { scale: 1.55; opacity: 0; }
}

/* Barra de progreso */
.progress {
  width: min(68vw, 260px);
  height: 10px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(74, 55, 40, .10);
  transition: box-shadow .6s ease;
}
.progress.is-complete {
  box-shadow: inset 0 1px 2px rgba(74, 55, 40, .10), 0 0 16px rgba(235, 139, 28, .45);
}
.progress__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 60%),
    linear-gradient(90deg, var(--grad-a), var(--grad-b));
  transition: width .6s var(--ease-out);
}

.percent {
  margin: .8rem 0 0;
  font-family: var(--sans);
  font-weight: 400;
  font-size: .9rem;
  letter-spacing: .14em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* Partículas */
.fx {
  position: fixed;
  inset: 0;
  z-index: 60;
  overflow: hidden;
  pointer-events: none;
}
.particle {
  position: absolute;
  display: block;
  margin: 0;
  translate: -50% -50%;
  animation: fly var(--d, 1s) var(--ease-out) forwards;
  will-change: transform, opacity;
}
.particle svg { display: block; width: 100%; height: 100%; }
.particle--dot { border-radius: 50%; background: currentColor; }
@keyframes fly {
  0%   { transform: translate(0, 0) scale(.3) rotate(0deg); opacity: 0; }
  12%  { opacity: .95; }
  70%  { opacity: .8; }
  100% { transform: translate(var(--dx), var(--dy)) scale(var(--s)) rotate(var(--r)); opacity: 0; }
}

/* =========================================================
   PANTALLA 2 · REGALO
   ========================================================= */

.screen--gift {
  /* Tamaños calculados para que polaroid + sobre entren en la altura visible */
  --pw: min(80vw, 330px, calc((100vh - 210px) / 1.73));
  --ew: min(66vw, 270px, calc(var(--pw) * .82));
  gap: clamp(.75rem, 2.4vh, 1.5rem);
}
@supports (height: 100dvh) {
  .screen--gift {
    --pw: min(80vw, 330px, calc((100dvh - 210px) / 1.73));
    gap: clamp(.75rem, 2.4dvh, 1.5rem);
  }
}
.screen--gift.is-entering > * { animation: rise .9s var(--ease-out) both; }
.screen--gift.is-entering > :nth-child(2) { animation-delay: .14s; }
.screen--gift.is-entering > :nth-child(3) { animation-delay: .26s; }
.screen--gift.is-entering > :nth-child(4) { animation-delay: .36s; }
@keyframes rise {
  from { opacity: 0; translate: 0 18px; }
  to   { opacity: 1; translate: 0 0; }
}

.title {
  margin: 0;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.75rem, 7.8vw, 2.5rem);
  line-height: 1.1;
  color: var(--ink);
}
.title span { display: block; }

.date {
  margin: .6rem 0 0;
  font-family: var(--sans);
  font-weight: 300;
  font-size: .8rem;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--terracota-soft);
}

/* Polaroid */
.polaroid {
  position: relative;
  width: var(--pw);
  margin: 0;
  padding: calc(var(--pw) * .045) calc(var(--pw) * .045) 0;
  background: var(--paper);
  border-radius: 3px;
  rotate: -1.2deg;
  box-shadow:
    0 1px 1px rgba(74, 55, 40, .06),
    0 6px 14px rgba(74, 55, 40, .10),
    0 24px 40px -14px rgba(74, 55, 40, .30);
}
/* cinta washi */
.polaroid::before {
  content: "";
  position: absolute;
  z-index: 2;
  top: -11px;
  left: 50%;
  width: 30%;
  height: 22px;
  translate: -50% 0;
  rotate: 2.5deg;
  background: rgba(229, 207, 160, .62);
  box-shadow: 0 1px 2px rgba(74, 55, 40, .08);
  pointer-events: none;
}

.carousel {
  display: flex;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  background: #E9DECD;
  cursor: grab;
  -webkit-touch-callout: none;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel.no-snap { scroll-snap-type: none; }
.carousel.is-dragging { cursor: grabbing; }

.slide {
  position: relative;
  flex: 0 0 100%;
  overflow: hidden;
  scroll-snap-align: center;
  scroll-snap-stop: always;
}
.slide img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .6s ease;
  pointer-events: none;
  -webkit-user-drag: none;
}
.slide img.is-loaded { opacity: 1; }
.slide img.is-missing { display: none; }

/* Placeholder elegante mientras no haya foto */
.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  color: var(--ink-soft);
  background:
    radial-gradient(90% 70% at 30% 20%, rgba(255, 255, 255, .5), transparent 60%),
    linear-gradient(150deg, #F0E4D1, #E3D0B4);
}
.slide:nth-child(2) .placeholder { background: radial-gradient(90% 70% at 70% 25%, rgba(255,255,255,.5), transparent 60%), linear-gradient(150deg, #F1E1D3, #E6CDB6); }
.slide:nth-child(3) .placeholder { background: radial-gradient(90% 70% at 40% 80%, rgba(255,255,255,.45), transparent 60%), linear-gradient(150deg, #EEE3D3, #DECDB3); }
.placeholder svg { width: 20%; opacity: .5; margin-bottom: .2rem; }
.placeholder span { font-style: italic; font-size: 1.25rem; opacity: .85; }
.placeholder small {
  font-family: var(--sans);
  font-size: .64rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .5;
}

.polaroid__bottom {
  height: calc(var(--pw) * .26);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--pw) * .02);
}

.dots { display: flex; gap: 2px; }
.dot {
  display: grid;
  place-items: center;
  width: 26px;
  height: 22px;
}
.dot::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warm-gray);
  transition: background .3s ease, transform .3s var(--ease-spring);
}
.dot.is-active::before {
  background: var(--terracota);
  transform: scale(1.25);
}

.bunting { width: 80%; height: auto; display: block; }

.wave {
  width: 92px;
  height: 12px;
  color: var(--terracota);
  opacity: .55;
  flex: none;
}

/* =========================================================
   SOBRE
   ========================================================= */

.envelope {
  position: relative;
  display: block;
  flex: none;
  width: var(--ew);
  aspect-ratio: 8 / 5;
  perspective: 900px;
  margin-top: .2rem;
}
.envelope > * { position: absolute; display: block; }

.envelope__back {
  inset: 0;
  border-radius: 6px;
  background: linear-gradient(180deg, #C9AA72, #D8BD89);
  box-shadow:
    0 14px 24px -8px rgba(74, 55, 40, .32),
    0 2px 4px rgba(74, 55, 40, .10);
}

.envelope__paper {
  z-index: 2;
  left: 7%;
  right: 7%;
  top: 8%;
  height: 84%;
  border-radius: 3px;
  background:
    repeating-linear-gradient(180deg, transparent 0 11px, rgba(184, 83, 35, .13) 11px 12px) 50% 18px / 70% 46px no-repeat,
    var(--paper);
  box-shadow: 0 -1px 3px rgba(74, 55, 40, .12);
  transition: transform .45s ease-in 0s;               /* al cerrar: baja primero */
}

.envelope__front {
  z-index: 3;
  inset: 0;
  width: 100%;
  height: 100%;
  clip-path: inset(0 round 6px);
}

.envelope__flap {
  z-index: 4;
  left: 0;
  top: 0;
  width: 100%;
  height: 58%;
  transform-origin: 50% 0;
  clip-path: inset(0 round 6px 6px 0 0);
  filter: drop-shadow(0 2px 2px rgba(74, 55, 40, .18));
  /* al cerrar: baja la solapa y recién a mitad de giro vuelve al frente */
  transition: transform .6s var(--ease-io) .35s, z-index 0s .65s, filter .6s ease .35s;
}

.envelope__seal {
  z-index: 5;
  left: 50%;
  top: 54%;
  width: 36%;
  aspect-ratio: 1;
  translate: -50% -50%;
  transition: transform .35s var(--ease-out) .85s, opacity .35s ease .85s;
}
.envelope__seal-inner {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: 50% 47% 52% 49% / 49% 53% 47% 51%;
  background: radial-gradient(circle at 34% 28%, #B8433B 0%, #9C2727 30%, #8B1E1E 58%, #6A1313 100%);
  box-shadow:
    0 3px 7px rgba(60, 10, 10, .38),
    inset 0 1px 0 rgba(255, 255, 255, .16),
    inset 0 -3px 6px rgba(0, 0, 0, .25);
  color: #FFF7EE;
  font-style: italic;
  font-weight: 500;
  font-size: calc(var(--ew) * .063);
  line-height: 1;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
  animation: breathe 2.8s ease-in-out infinite;
}
/* anillo estampado */
.envelope__seal-inner::before {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  border: 1px solid rgba(255, 228, 210, .32);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .07);
}
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.045); }
}

/* --- Sobre abierto --- */
.envelope.is-open .envelope__seal {
  transform: scale(.55);
  opacity: 0;
  transition: transform .3s ease-in 0s, opacity .3s ease 0s;
}
.envelope.is-open .envelope__flap {
  transform: rotateX(180deg);
  z-index: 1;
  filter: drop-shadow(0 -1px 2px rgba(74, 55, 40, .12)) brightness(.94);
  transition: transform .6s var(--ease-io) .2s, z-index 0s .5s, filter .6s ease .2s;
}
.envelope.is-open .envelope__paper {
  transform: translateY(-42%);
  transition: transform .7s var(--ease-out) .7s;
}

/* =========================================================
   CARTA (modal)
   ========================================================= */

.letter-modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 24px;
}
.letter-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(74, 55, 40, .38);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity .45s ease;
}
.letter {
  position: relative;
  width: min(88vw, 380px);
  max-height: 84vh;
  max-height: 84dvh;
  overflow-y: auto;
  padding: 46px 30px 28px;
  text-align: center;
  border-radius: 4px;
  background:
    radial-gradient(80% 50% at 0% 0%, rgba(229, 207, 160, .22), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(229, 207, 160, .26), transparent 60%),
    #FBF7F0;
  box-shadow:
    0 30px 60px -20px rgba(40, 25, 15, .5),
    0 4px 12px rgba(40, 25, 15, .15);
  opacity: 0;
  transform: translateY(40px) scale(.96);
  transition: transform .6s var(--ease-out), opacity .45s ease;
}
.letter::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(184, 83, 35, .16);
  border-radius: 2px;
  pointer-events: none;
}
.letter-modal.is-visible .letter-modal__backdrop { opacity: 1; }
.letter-modal.is-visible .letter { opacity: 1; transform: none; }

.letter__x {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  font-family: var(--sans);
  font-weight: 300;
  font-size: 1.6rem;
  line-height: 1;
  color: var(--ink-soft);
  opacity: .6;
}
.letter__ornament {
  width: 110px;
  height: auto;
  color: var(--terracota);
  opacity: .75;
}
.letter__to {
  margin: 1rem 0 0;
  font-style: italic;
  font-size: 1.2rem;
  color: var(--ink-soft);
}
.letter__body {
  margin: 1.1rem 0 0;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.8rem, 8vw, 2.2rem);
  line-height: 1.25;
  color: var(--ink);
}
.letter__sign {
  margin: 1.4rem 0 0;
  font-style: italic;
  font-size: 1.35rem;
  color: var(--terracota);
}
.letter__close {
  margin-top: 1.8rem;
  padding: 6px 2px 3px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: .72rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-bottom: 1px solid rgba(124, 100, 82, .35);
}

/* =========================================================
   Movimiento reducido
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
  .heart-beat,
  .envelope__seal-inner { animation: none; }
  .screen--gift.is-entering > * { animation-duration: .01s; animation-delay: 0s !important; }
}

</style>
  </head>
<body>
<main class="app">

  <!-- ======================= PANTALLA 1 · DESBLOQUEO ======================= -->
  <section class="screen screen--unlock" id="screen-unlock" aria-label="Desbloqueo">
    <h1 class="name">Mile</h1>
    <p class="hint" id="hint" aria-live="polite">Toca el corazón</p>

    <button class="heart-btn" id="heart" type="button" aria-label="Tocar el corazón">
      <span class="heart-beat">
        <svg class="heart-svg" viewBox="0 0 100 90" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#D06B36"/>
              <stop offset=".55" stop-color="#B85323"/>
              <stop offset="1" stop-color="#9C421A"/>
            </linearGradient>
          </defs>
          <path fill="url(#heartGrad)" d="M50 86C20 64 2 46 2 27 2 12 14 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c14 0 26 10 26 25 0 19-18 37-48 59Z"/>
          <ellipse cx="26" cy="19" rx="11" ry="6" transform="rotate(-30 26 19)" fill="#fff" opacity=".16"/>
        </svg>
      </span>
    </button>

    <div class="progress" id="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="progress__fill" id="progress-fill"></span>
    </div>
    <p class="percent" id="percent">0%</p>
  </section>

  <!-- ======================= PANTALLA 2 · REGALO ======================= -->
  <section class="screen screen--gift" id="screen-gift" aria-label="Regalo" hidden>

    <header class="gift-header">
      <h2 class="title"><span>Hoy es el cumpleaños</span> <span>del amor de mi vida</span></h2>
      <p class="date">20 de noviembre</p>
    </header>

    <figure class="polaroid">
      <!-- Fotos: ./img/foto1.jpg, foto2.jpg, foto3.jpg

<script>
/* =========================================================
   Cumple Mile · lógica
   ========================================================= */

/* ---------- Textos de la pantalla 1 (índice = cantidad de toques) ---------- */
const HINTS = [
  'Toca el corazón',   // 0%
  'Otra vez',          // 17%
  'Seguí tocando...',  // 33%
  'Vas por la mitad',  // 50%
  'Un poquito más',    // 67%
  'Ya casi...',        // 83%
  '¡La última vez!'    // 100%
];
const AUTO_ADVANCE_MS = 600;   // pausa al llegar a 100% antes de pasar a la pantalla 2
const PARTICLE_COLORS = ['#B85323', '#C6541D', '#EB8B1C', '#E39A6B', '#D4775A', '#E5CFA0'];
const HEART_PATH = 'M50 86C20 64 2 46 2 27 2 12 14 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c14 0 26 10 26 25 0 19-18 37-48 59Z';

(() => {
  'use strict';

  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => [...root.querySelectorAll(s)];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };

  /* Reinicia una animación CSS aunque se dispare muy seguido */
  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  /* =======================================================
     Partículas
     ======================================================= */
  const fx = $('#fx');

  function burst(x, y, count, fullCircle = false) {
    if (reduceMotion) count = Math.ceil(count / 3);
    for (let i = 0; i < count; i++) {
      const isHeart = Math.random() < 0.7;
      const size = isHeart ? rand(10, 20) : rand(4, 8);
      const angle = (fullCircle ? rand(0, 360) : rand(-165, -15)) * Math.PI / 180;
      const dist = rand(70, 150) * (fullCircle ? 1.35 : 1);
      const el = document.createElement('span');
      el.className = 'particle ' + (isHeart ? 'particle--heart' : 'particle--dot');
      el.style.cssText =
        `left:${x + rand(-18, 18)}px;top:${y + rand(-14, 14)}px;` +
        `width:${size}px;height:${size}px;color:${pick(PARTICLE_COLORS)};` +
        `--dx:${(Math.cos(angle) * dist).toFixed(1)}px;` +
        `--dy:${(Math.sin(angle) * dist - 20).toFixed(1)}px;` +
        `--r:${rand(-45, 45).toFixed(0)}deg;--s:${rand(.6, 1.1).toFixed(2)};` +
        `--d:${rand(750, 1250).toFixed(0)}ms`;
      if (isHeart) el.innerHTML = `<svg viewBox="0 0 100 90"><path d="${HEART_PATH}" fill="currentColor"/></svg>`;
      el.addEventListener('animationend', () => el.remove(), { once: true });
      fx.appendChild(el);
    }
  }

  function centerOf(el, yFactor = .5) {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height * yFactor];
  }

  /* =======================================================
     PANTALLA 1 · Desbloqueo
     ======================================================= */
  const unlock   = $('#screen-unlock');
  const gift     = $('#screen-gift');
  const heartBtn = $('#heart');
  const heartSvg = $('.heart-svg', heartBtn);
  const hint     = $('#hint');
  const bar      = $('#progress');
  const fill     = $('#progress-fill');
  const pct      = $('#percent');

  const TOTAL = HINTS.length - 1;   // 6 toques
  let taps = 0;
  let advancing = false;
  let autoTimer = null;

  function ring() {
    const el = document.createElement('span');
    el.className = 'ring';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    heartBtn.appendChild(el);
  }

  function onHeartTap() {
    if (advancing) return;

    // Toque final después del 100% -> pasa directo
    if (taps >= TOTAL) { goToGift(); return; }

    taps++;
    const p = Math.round(taps / TOTAL * 100);

    hint.textContent = HINTS[taps];
    restartAnim(hint, 'is-changing');

    fill.style.width = p + '%';
    bar.setAttribute('aria-valuenow', p);
    pct.textContent = p + '%';
    heartBtn.style.setProperty('--level', (taps / TOTAL).toFixed(3));

    restartAnim(heartSvg, 'is-pop');
    ring();

    const [x, y] = centerOf(heartBtn, .45);
    const done = taps === TOTAL;
    burst(x, y, done ? 26 : 9, done);
    vibrate(done ? [20, 40, 30] : 12);

    if (done) {
      bar.classList.add('is-complete');
      autoTimer = setTimeout(goToGift, AUTO_ADVANCE_MS);
    }
  }

  function goToGift() {
    if (advancing) return;
    advancing = true;
    clearTimeout(autoTimer);
    unlock.classList.add('is-leaving');

    const show = () => {
      unlock.hidden = true;
      gift.hidden = false;
      window.scrollTo(0, 0);
      gift.classList.add('is-entering');
      setTimeout(() => gift.classList.remove('is-entering'), 1600);
    };
    reduceMotion ? show() : setTimeout(show, 700);
  }

  heartBtn.addEventListener('click', onHeartTap);

  /* =======================================================
     PANTALLA 2 · Carrusel
     ======================================================= */
  const track  = $('#carousel');
  const slides = $$('.slide', track);
  const dots   = $$('.dot');
  let current = 0;

  const slideW = () => track.clientWidth || 1;

  function setActive(i) {
    if (i === current) return;
    current = i;
    dots.forEach((d, k) => {
      d.classList.toggle('is-active', k === i);
      d.setAttribute('aria-selected', String(k === i));
    });
  }

  function goTo(i, smooth = true) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    track.scrollTo({ left: i * slideW(), behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
    setActive(i);
  }

  // Sincroniza los puntitos con el scroll (swipe nativo)
  let raf = 0;
  track.addEventListener('scroll', () => {
    if (drag) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => setActive(Math.round(track.scrollLeft / slideW())));
  }, { passive: true });

  dots.forEach((d, k) => d.addEventListener('click', () => goTo(k)));

  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(current - 1); }
  });

  // Arrastre con mouse (en touch se usa el scroll nativo con scroll-snap)
  let drag = null;
  let snapTimer = null;

  track.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    clearTimeout(snapTimer);
    drag = { x: e.clientX, left: track.scrollLeft, t: performance.now() };
    track.classList.add('no-snap', 'is-dragging');
    track.setPointerCapture(e.pointerId);
  });

  track.addEventListener('pointermove', e => {
    if (!drag) return;
    track.scrollLeft = drag.left - (e.clientX - drag.x);
  });

  function endDrag(e) {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const speed = Math.abs(dx) / Math.max(1, performance.now() - drag.t);
    const w = slideW();
    const from = Math.round(drag.left / w);
    let target = Math.round(track.scrollLeft / w);
    if (Math.abs(dx) > 8 && (speed > .4 || Math.abs(dx) > w * .18)) target = from + (dx < 0 ? 1 : -1);

    drag = null;
    track.classList.remove('is-dragging');
    goTo(target);
    snapTimer = setTimeout(() => track.classList.remove('no-snap'), 550);
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', () => {
    track.scrollTo({ left: current * slideW(), behavior: 'auto' });
  });

  // Fotos: fade-in al cargar, placeholder si no existen
  $$('.slide img').forEach(img => {
    const ok   = () => img.classList.add('is-loaded');
    const fail = () => img.classList.add('is-missing');
    if (img.complete) {
      img.naturalWidth > 0 ? ok() : fail();
    } else {
      img.addEventListener('load', ok, { once: true });
      img.addEventListener('error', fail, { once: true });
    }
  });

  /* =======================================================
     Sobre + carta
     ======================================================= */
  const envelope = $('#envelope');
  const modal    = $('#letter');
  let opening = false;

  envelope.addEventListener('click', () => {
    if (opening || envelope.classList.contains('is-open')) return;
    opening = true;
    envelope.classList.add('is-open');
    envelope.setAttribute('aria-expanded', 'true');
    vibrate(15);

    const [x, y] = centerOf(envelope, .54);
    burst(x, y, 10);

    setTimeout(() => { openLetter(); opening = false; }, reduceMotion ? 0 : 1250);
  });

  function openLetter() {
    modal.hidden = false;
    document.body.classList.add('modal-open');
    void modal.offsetWidth;
    modal.classList.add('is-visible');
    $('.letter__close', modal).focus({ preventScroll: true });

    const letter = $('.letter', modal);
    setTimeout(() => {
      const [x, y] = centerOf(letter, .15);
      burst(x, y, 14, true);
    }, reduceMotion ? 0 : 250);
  }

  function closeLetter() {
    if (modal.hidden || !modal.classList.contains('is-visible')) return;
    modal.classList.remove('is-visible');
    document.body.classList.remove('modal-open');
    setTimeout(() => {
      modal.hidden = true;
      envelope.classList.remove('is-open');      // el sobre se vuelve a cerrar
      envelope.setAttribute('aria-expanded', 'false');
      envelope.focus({ preventScroll: true });
    }, reduceMotion ? 0 : 450);
  }

  $$('[data-close]', modal).forEach(b => b.addEventListener('click', closeLetter));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });
})();

</script>
</body>
</html>
